<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechCorp Financial Assistant</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'sans-serif'],
        },
        colors: {
          ios: {
            blue: '#0A84FF',
            gray: '#F0F0F2',
          }
        }
      }
    }
  }
</script>
<style>
  html, body { height: 100%; }
  #chat-scroll::-webkit-scrollbar { width: 6px; }
  #chat-scroll::-webkit-scrollbar-thumb { background: transparent; }
  .bubble-in { animation: bubbleIn .18s ease-out; }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(6px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .typing-dot { animation: typingBounce 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: .15s; }
  .typing-dot:nth-child(3) { animation-delay: .3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
</style>
</head>
<body class="h-full bg-white font-sans antialiased text-neutral-900">

  <div class="h-full flex flex-col">

    <!-- Top bar -->
    <header class="shrink-0 bg-white/90 backdrop-blur-md border-b border-neutral-100 sticky top-0 z-10">
      <div class="max-w-2xl mx-auto px-5 py-3.5 flex items-center justify-between">
        <div>
          <h1 class="text-[17px] font-semibold text-neutral-900 leading-tight">TechCorp Assistant</h1>
          <p class="text-[12px] text-neutral-400 leading-tight">Phi-3.5 Financial</p>
        </div>
        <div id="status-pill" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-neutral-50 border border-neutral-100">
          <span id="status-dot" class="w-2 h-2 rounded-full bg-neutral-300"></span>
          <span id="status-text" class="text-[12px] font-medium text-neutral-400">Connexion...</span>
        </div>
      </div>
    </header>

    <!-- Chat area -->
    <main id="chat-scroll" class="flex-1 overflow-y-auto">
      <div id="messages" class="max-w-2xl mx-auto px-5 py-6 space-y-3">
        <!-- messages injected here -->
      </div>
    </main>

    <!-- Input bar -->
    <footer class="shrink-0 bg-white/90 backdrop-blur-md border-t border-neutral-100">
      <div class="max-w-2xl mx-auto px-5 py-4">
        <form id="chat-form" class="flex items-end gap-2.5">
          <div class="flex-1 flex items-center bg-ios-gray rounded-full px-4 py-2.5">
            <input
              id="chat-input"
              type="text"
              autocomplete="off"
              placeholder="Message"
              class="flex-1 bg-transparent outline-none text-[15px] text-neutral-900 placeholder-neutral-400"
            />
          </div>
          <button
            id="send-btn"
            type="submit"
            class="w-10 h-10 shrink-0 rounded-full bg-ios-blue flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed transition hover:bg-blue-600"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" class="w-4.5 h-4.5 -rotate-45 translate-x-[1px]">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </form>
      </div>
    </footer>

  </div>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
